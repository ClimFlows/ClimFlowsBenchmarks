[project]
name = "climflows-torch-sht-benchmark"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cuda-bindings==13.5.0",
    "numpy==2.3.4",
    "tomli-w==1.2.0",
    "torch==2.9.1",
    "torch-harmonics-cu130==0.9.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torch-harmonics-cu130 = { index = "nvidia" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true
